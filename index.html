<style>

  .app { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
  .card { background: rgba(255,255,255,.92); border-radius: 18px; padding: 20px; box-shadow: 0 10px 30px rgba(30,64,175,.12); }

  .subtitle { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 18px; }

  .question { font-size: 18px; font-weight: 700; line-height: 1.5; margin: 0 0 14px; }
  .options { display: grid; gap: 10px; }
  .option { width: 100%; text-align: left; padding: 14px 15px; border: 1px solid #dbe1ea; border-radius: 12px; background: #fff; font-size: 15px; line-height: 1.45; cursor: pointer; transition: .15s; color: #1f2937; }
  .option:hover { border-color: #6366f1; background: #f5f3ff; }
  .option.selected { border-color: #6366f1; background: #eef2ff; box-shadow: 0 0 0 2px #c7d2fe inset; }
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button.primary, button.secondary { flex: 1; padding: 12px 14px; border: 0; border-radius: 12px; font-size: 15px; cursor: pointer; }
  button.primary { background: #4f46e5; color: #fff; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: #e5e7eb; color: #374151; }
  .hidden { display: none !important; }
  .result-icon { font-size: 56px; text-align: center; margin: 8px 0; }
  .result-title { font-size: 26px; font-weight: 800; text-align: center; margin: 0 0 6px; color: #4338ca; }
  .result-desc { color: #475569; line-height: 1.7; font-size: 15px; margin: 12px 0; }
  .match { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .tag { background: #eef2ff; color: #4338ca; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
  .footer-note { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 14px; }
  .msg { min-height: 18px; color: #dc2626; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">

    <h1>你上辈子是什么？</h1>
    <p class="subtitle">5 道题，测测你前世最可能的身份 · 娱乐测试</p>

    <section id="quizSection" data-testid="quiz-section">
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar" data-testid="progress-bar"></div>
      </div>
      <div id="questionIndex" class="subtitle" data-testid="question-index"></div>
      <h2 id="questionText" class="question" data-testid="question-text"></h2>
      <div id="options" class="options" data-testid="options"></div>
      <div id="quizMsg" class="msg" data-testid="quiz-msg"></div>
      <div class="nav">
        <button id="prevBtn" class="secondary" data-testid="prev-btn">上一题</button>
        <button id="nextBtn" class="primary" data-testid="next-btn">下一题</button>
      </div>
    </section>

    <section id="resultSection" class="hidden" data-testid="result-section">
      <div id="resultIcon" class="result-icon" data-testid="result-icon"></div>
      <h2 id="resultTitle" class="result-title" data-testid="result-title"></h2>
      <div id="resultMatch" class="match" data-testid="result-match"></div>
      <div id="resultDesc" class="result-desc" data-testid="result-desc"></div>
      <div id="resultTags" class="tags" data-testid="result-tags"></div>
      <div class="nav">
        <button id="restartBtn" class="primary" data-testid="restart-btn">再测一次</button>
      </div>
    </section>

    <p class="footer-note">本测试仅为娱乐，结果不具备任何现实依据。</p>
  </div>
</div>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你上辈子是什么</title>
<style>
  body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
  .box { background: #fff; padding: 20px; border-radius: 10px; }
  button { padding: 12px; width: 100%; margin-bottom: 10px; background: #fff; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: left; }
  .next { background: #4f46e5; color: #fff; border: none; text-align: center; }
</style>
</head>
<body>
  <div class="box">
    <h2 id="title">你上辈子是什么？</h2>
    <div id="area"></div>
    <button id="btn" class="next" onclick="next()">下一题</button>
  </div>

<script>
  var q = [
    { t: "你最想拥有哪种能力？", o: ["过目不忘", "临危不乱", "看透商机", "极致手艺"] },
    { t: "周末最想怎么过？", o: ["安静看书", "户外运动", "约朋友逛街", "在家做手工"] }
  ];
  var step = 0;

  function show() {
    var area = document.getElementById("area");
    area.innerHTML = "<h3>" + q[step].t + "</h3>";
    for(var i=0; i<q[step].o.length; i++) {
      area.innerHTML += "<button onclick='next()'>" + q[step].o[i] + "</button>";
    }
  }

  function next() {
    step++;
    if(step < q.length) {
      show();
    } else {
      document.getElementById("title").innerText = "你的结果";
      document.getElementById("area").innerHTML = "<h3>你的上辈子：书香书生 📜</h3><p>测试成功！</p>";
      document.getElementById("btn").style.display = "none";
    }
  }
  show();
</script>
</body>
</html>
